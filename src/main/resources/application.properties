spring.application.name=tickets-service
server.port=8080

# Carpeta donde el contenedor ve el EFS (docker run -v /mnt/efs:/app/efs)
efs.path=/app/efs

# Bucket S3 y region (el bucket llega como variable de entorno desde el pipeline)
s3.bucket=${S3_BUCKET}
aws.region=us-east-1

# Base de datos H2 guardada en el EFS, asi el historial no se pierde al redesplegar
spring.datasource.url=jdbc:h2:file:/app/efs/db/tickets
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Endpoint /actuator/health para verificar que la app esta arriba
management.endpoints.web.exposure.include=health
