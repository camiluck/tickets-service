spring.application.name=tickets-service
server.port=8080

# ---------------- EFS ----------------
# Carpeta donde el contenedor ve el EFS (docker run -v /mnt/efs:/app/efs)
app.efs.base-path=${EFS_PATH:/app/efs}

# ---------------- S3 -----------------
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-1}
app.s3.auto-upload=${S3_AUTO_UPLOAD:true}
# Solo para pruebas locales con un S3 simulado; en AWS se deja vacio
app.s3.endpoint=${S3_ENDPOINT:}

# ---------------- Base de datos ----------------
# H2 en archivo dentro del EFS: el historial de tickets sobrevive a cada redeploy del contenedor
spring.datasource.url=jdbc:h2:file:${app.efs.base-path}/db/tickets
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------- JSON ----------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------- Actuator ----------------
management.endpoints.web.exposure.include=health,info
