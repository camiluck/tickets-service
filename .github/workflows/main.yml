name: CI/CD - Build, Docker Hub y despliegue en EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: tickets-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Compilar y ejecutar las pruebas
      - name: Compilar y probar con Maven
        run: mvn -B verify

      # 4. Login en Docker Hub
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Construir y publicar la imagen (tag latest + tag con el commit)
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Desplegar en EC2: montar EFS, bajar la imagen nueva y levantar el contenedor
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest
          EFS_DNS: ${{ secrets.EFS_DNS }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE,EFS_DNS,S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e

            # --- Preparar la EC2 (solo la primera vez): Docker y cliente NFS ---
            if ! command -v docker > /dev/null; then
              echo "Instalando Docker..."
              sudo dnf install -y docker || sudo apt-get install -y docker.io
            fi
            command -v mount.nfs4 > /dev/null || sudo dnf install -y nfs-utils || sudo apt-get install -y nfs-common
            sudo systemctl enable --now docker

            # --- EFS: montar si aun no esta montado ---
            sudo mkdir -p /mnt/efs
            if ! mountpoint -q /mnt/efs; then
              echo "Montando EFS $EFS_DNS en /mnt/efs"
              sudo mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport "$EFS_DNS":/ /mnt/efs
            fi
            df -h /mnt/efs

            # --- Credenciales AWS: solo se pasan si existen los secrets.
            #     Si la EC2 tiene el rol LabInstanceProfile, no hacen falta. ---
            AWS_ARGS=""
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              AWS_ARGS="-e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            fi

            # --- Reemplazar el contenedor ---
            sudo docker pull "$DOCKER_IMAGE"
            sudo docker rm -f tickets-service 2>/dev/null || true
            sudo docker run -d --name tickets-service --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              -e S3_BUCKET="$S3_BUCKET" \
              -e AWS_REGION="${AWS_REGION:-us-east-1}" \
              $AWS_ARGS \
              "$DOCKER_IMAGE"

            sudo docker image prune -f

            # --- Verificar que la app responde ---
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8080/actuator/health > /dev/null; then
                echo "Aplicacion arriba"
                sudo docker ps --filter name=tickets-service
                exit 0
              fi
              sleep 3
            done
            echo "La aplicacion no respondio a tiempo"
            sudo docker logs --tail 100 tickets-service
            exit 1
