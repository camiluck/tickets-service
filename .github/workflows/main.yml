name: CI/CD - Build, Docker Hub y despliegue en EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Compilar el proyecto y generar el .jar
      - name: Compilar con Maven
        run: mvn -B package

      # 4. Login en Docker Hub
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Construir la imagen y publicarla en Docker Hub
      - name: Construir y publicar imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest

      # 6. Conectarse por SSH a la EC2 y desplegar el contenedor con el EFS montado
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar Docker si la EC2 aun no lo tiene
            if ! command -v docker > /dev/null; then
              sudo dnf install -y docker
            fi
            sudo systemctl enable --now docker

            # Montar el EFS en /mnt/efs si no esta montado
            sudo mkdir -p /mnt/efs
            if ! mountpoint -q /mnt/efs; then
              sudo mount -t nfs4 -o nfsvers=4.1 ${{ secrets.EFS_DNS }}:/ /mnt/efs
            fi

            # Bajar la imagen nueva y reemplazar el contenedor
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest
            sudo docker rm -f tickets-service || true
            sudo docker run -d --name tickets-service --restart always \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest

            sudo docker ps
